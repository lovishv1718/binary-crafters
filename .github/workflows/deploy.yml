# Builds the site on GitHub (the hosting plan is too small to build it) and publishes the
# ready-to-run server to the `deploy` branch, which GoDaddy's Node.js app pulls from.
name: Build for GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          STANDALONE: '1'
          NEXT_PUBLIC_SITE_URL: https://binarycrafters.com
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble server bundle
        run: |
          OUT=deploy-out
          cp -r .next/standalone "$OUT"
          rm -f "$OUT/.env"
          cp -r .next/static "$OUT/.next/static"
          cp -r public "$OUT/public"
          # The host discards node_modules and runs `npm install` itself, so ship the runtime
          # dependencies pinned to the exact versions this build used. No build script on purpose.
          rm -rf "$OUT/node_modules"
          node -e '
            const pkg = require("./package.json")
            const deps = {}
            for (const name of Object.keys(pkg.dependencies)) deps[name] = require(`./node_modules/${name}/package.json`).version
            const out = { name: pkg.name, private: true, type: "commonjs", engines: { node: ">=20.9" }, scripts: { start: "HOSTNAME=0.0.0.0 node server.js" }, dependencies: deps }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out, null, 2))
          ' "$OUT/package.json"
          cp .npmrc "$OUT/.npmrc"
          cat "$OUT/package.json"
          cp scripts/DEPLOY_README.md "$OUT/README.md"

      - name: Publish to deploy branch
        run: |
          # Add each build as a normal commit on top of the branch (no force push), so the host's
          # `git pull` fast-forwards cleanly instead of merging old builds into new ones.
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch deploy "$REPO" publish || { mkdir publish && git -C publish init -q -b deploy; }
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r deploy-out/. publish/
          cd publish
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git commit -qm "Build ${GITHUB_SHA::7}" || { echo "No changes"; exit 0; }
          git push "$REPO" HEAD:deploy

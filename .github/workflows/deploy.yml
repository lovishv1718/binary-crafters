# Builds the site on GitHub (the hosting plan is too small to build it) and publishes the
# ready-to-run server to the `deploy` branch, which GoDaddy's Node.js app pulls from.
name: Build for GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          STANDALONE: '1'
          NEXT_PUBLIC_SITE_URL: https://binarycrafters.com
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble server bundle
        run: |
          OUT=deploy-out
          cp -r .next/standalone "$OUT"
          rm -f "$OUT/.env"
          cp -r .next/static "$OUT/.next/static"
          cp -r public "$OUT/public"
          # Dependencies are already bundled, so `npm install` on the host has nothing to do.
          echo '{"name":"binary-crafters","private":true,"scripts":{"start":"node server.js"}}' > "$OUT/package.json"
          cp scripts/DEPLOY_README.md "$OUT/README.md"

      - name: Publish to deploy branch
        run: |
          cd deploy-out
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
